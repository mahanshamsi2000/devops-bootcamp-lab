# زبان و کیبورد
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/layoutcode string us
d-i time/zone string UTC

# شبکه
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string devops-lab
d-i netcfg/get_domain string local

# کاربر
d-i passwd/user-fullname string vagrant
d-i passwd/username string vagrant
d-i passwd/user-password password vagrant
d-i passwd/user-password-again password vagrant
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# پارتیشن‌بندی: کل دیسک مجازی
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i grub-installer/bootdev string /dev/sda

# تنظیمات Ubiquity
ubiquity ubiquity/summary note
ubiquity ubiquity/reboot boolean true
ubiquity ubiquity/poweroff boolean false
ubiquity ubiquity/download_updates boolean false
ubiquity ubiquity/use_nonfree boolean false
ubiquity ubiquity/minimal_install boolean false

# بعد از نصب: sudo بدون رمز و SSH
ubiquity ubiquity/success_command string \
  echo 'vagrant ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/vagrant; \
  chmod 440 /target/etc/sudoers.d/vagrant; \
  chroot /target apt-get update; \
  chroot /target apt-get install -y openssh-server; \
  chroot /target systemctl enable ssh